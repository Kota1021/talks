<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人名は「姓＋名」ではない</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">

<style>
:root{
  --ground:#F1EDE8; --surface:#FBF8F4; --rule:#DED4C8;
  --ink:#241C16; --dim:#6E6055; --faint:#9C8C7E;
  --flag:#C0361D; --flag-soft:rgba(192,54,29,.10); --flag-line:rgba(192,54,29,.38);
  --fix:#2C7355; --fix-soft:rgba(44,115,85,.10); --amber:#9A6B12;
  --mono:'IBM Plex Mono','Zen Kaku Gothic New',ui-monospace,monospace;
  --sans:'Zen Kaku Gothic New',system-ui,sans-serif;
  --rail:min(30rem,34vw);
  --dur:.34s;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#17120F; --surface:#1E1814; --rule:#372C25;
    --ink:#EFE6DC; --dim:#A29386; --faint:#6B5D52;
    --flag:#F2603F; --flag-soft:rgba(242,96,63,.13); --flag-line:rgba(242,96,63,.45);
    --fix:#5FBE93; --fix-soft:rgba(95,190,147,.12); --amber:#D9A441;
  }
}
:root[data-theme="dark"]{
  --ground:#17120F; --surface:#1E1814; --rule:#372C25;
  --ink:#EFE6DC; --dim:#A29386; --faint:#6B5D52;
  --flag:#F2603F; --flag-soft:rgba(242,96,63,.13); --flag-line:rgba(242,96,63,.45);
  --fix:#5FBE93; --fix-soft:rgba(95,190,147,.12); --amber:#D9A441;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  display:grid; grid-template-rows:auto 1fr auto; cursor:default;
}

/* ---------- top bar ---------- */
.top{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:1.1rem clamp(1rem,3vw,2.6rem) .9rem;
  border-bottom:1px solid var(--rule);
  font-family:var(--mono); font-size:clamp(.72rem,1vw,.9rem);
  letter-spacing:.14em; text-transform:uppercase;
  transition:padding-right var(--dur) cubic-bezier(.4,0,.2,1);
}
body.open .top,body.open .bottom{padding-right:calc(var(--rail) + clamp(1rem,3vw,2.6rem))}
.act{color:var(--dim); transition:color var(--dur)}
.act b{color:var(--ink); font-weight:600; letter-spacing:.1em}
.count{color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap}
.count b{color:var(--flag); font-weight:600; font-size:1.35em}

/* ---------- stage ---------- */
.stage{
  display:grid; place-items:center; overflow:hidden;
  padding:clamp(1rem,3vh,2.4rem) clamp(1rem,3vw,3rem);
  transition:padding-right var(--dur) cubic-bezier(.4,0,.2,1);
  grid-template-areas:"a"; position:relative;
}
.stage>*{grid-area:a}
body.open .stage{padding-right:calc(var(--rail) + clamp(1rem,3vw,3rem))}

/* ---------- the form — the thing under review ---------- */
.form{
  width:min(36rem,100%); font-size:clamp(13px,1.35vw,24px);
  background:var(--surface); border:1px solid var(--rule); border-radius:14px;
  padding:1.5em 1.7em 1.4em;
}
.fhead{display:flex; align-items:baseline; justify-content:space-between; gap:1em; margin-bottom:1.1em}
.svc{font-family:var(--mono); font-size:.62em; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.ftitle{font-weight:900; font-size:1.05em}
.who{
  font-family:var(--mono); font-size:.62em; letter-spacing:.08em; color:var(--dim);
  border:1px solid var(--rule); border-radius:999px; padding:.25em .9em; white-space:nowrap;
}
.row{display:grid; grid-template-columns:minmax(4.6em,max-content) 1fr; align-items:start; gap:.4em .9em; margin-top:.75em}
.row label{padding-top:.55em; font-weight:700; font-size:.86em; white-space:nowrap}
.req{
  display:inline-block; margin-left:.4em; font-size:.66em; font-weight:700; color:var(--flag);
  letter-spacing:.06em; vertical-align:.12em;
}
.inp{
  min-height:2.3em; padding:.38em .7em; border:1.5px solid var(--rule); border-radius:7px;
  background:var(--ground); font-size:.98em; line-height:1.45; overflow-wrap:anywhere;
  transition:border-color var(--dur),background var(--dur);
}
.inp.empty::after{content:'\00a0'}
@keyframes blink{50%{opacity:0}}
.fmsg{grid-column:2; font-size:.7em; font-weight:700; letter-spacing:.04em; margin-top:-.1em}
.row.err .inp{border-color:var(--flag); background:var(--flag-soft)}
.row.err .fmsg{color:var(--flag)}
.row.ok .inp{border-color:var(--fix)}
.row.ok .fmsg{color:var(--fix)}
.row.rw .inp{border-color:var(--amber)}
.row.rw .fmsg{color:var(--amber)}
.rw-was{color:var(--flag); text-decoration:line-through; opacity:.7}
.rw-arr{color:var(--faint); padding:0 .45em; font-family:var(--mono)}
.row.ghost label{color:var(--flag); font-weight:500; font-size:.76em}
.row.ghost .inp{border:1.5px dashed var(--flag-line); background:transparent; color:var(--flag)}
.row.ghost .fmsg{color:var(--flag)}
.submit{
  margin-top:1.3em; display:flex; align-items:center; justify-content:space-between; gap:1em;
  padding-top:1.05em; border-top:1px solid var(--rule);
}
.btn{
  font-weight:700; font-size:.82em; color:var(--surface); background:var(--ink);
  border-radius:7px; padding:.45em 1.4em; white-space:nowrap;
}
.verdict{font-weight:700; font-size:.8em}
.verdict.err{color:var(--flag)}
.verdict.ok{color:var(--fix)}
.form.hit .verdict{animation:rise var(--dur) cubic-bezier(.2,.7,.3,1) both}

/* ---------- rail ---------- */
.rail{
  position:fixed; z-index:4; top:0; right:0; bottom:0; width:var(--rail);
  background:var(--surface); border-left:1px solid var(--rule);
  padding:clamp(1.4rem,3.4vh,2.6rem) clamp(1.2rem,2vw,2rem);
  display:flex; flex-direction:column; gap:1.15rem; overflow-y:auto;
  transform:translateX(101%); transition:transform var(--dur) cubic-bezier(.4,0,.2,1);
}
body.open .rail{transform:none}

.no{
  font-family:var(--mono); font-size:clamp(2.4rem,4.4vw,3.9rem); line-height:.9;
  font-weight:600; color:var(--flag); font-variant-numeric:tabular-nums;
}
.wait{font-size:clamp(2.4rem,4.4vw,3.9rem); line-height:.9; font-weight:900; color:var(--rule)}
.label{
  font-size:clamp(1.1rem,1.9vw,1.75rem); font-weight:700; line-height:1.42;
  text-wrap:balance;
}
.punch{
  font-size:clamp(1rem,1.65vw,1.5rem); font-weight:500; line-height:1.6;
  color:var(--flag); text-wrap:balance;
  border-left:3px solid var(--flag); padding-left:.85em;
}
.note{font-size:clamp(.86rem,1.12vw,1.06rem); line-height:1.85; color:var(--dim); max-width:34em}
.note b{color:var(--ink)}
.fix{
  font-family:var(--mono); font-size:clamp(.7rem,.94vw,.92rem); line-height:1.75;
  background:var(--ground); border:1px solid var(--rule); border-radius:5px;
  padding:.85em 1em; white-space:pre-wrap; word-break:break-word;
}
.fix .add{color:var(--fix); display:block}
.src{
  margin-top:auto; padding-top:1rem; border-top:1px solid var(--rule);
  font-size:clamp(.68rem,.86vw,.82rem); line-height:1.7; color:var(--faint);
}
.reveal>*{animation:rise var(--dur) cubic-bezier(.2,.7,.3,1) both}
.reveal>*:nth-child(2){animation-delay:.05s}
.reveal>*:nth-child(3){animation-delay:.1s}
.reveal>*:nth-child(4){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- ticks ---------- */
.bottom{
  display:flex; align-items:center; gap:clamp(1rem,2.4vw,2rem);
  padding:.45rem clamp(1rem,3vw,2.6rem) .5rem; border-top:1px solid var(--rule);
  transition:padding-right var(--dur) cubic-bezier(.4,0,.2,1);
}
.ticks{display:flex; gap:4px; flex:1 1 auto; min-width:2rem}
.tk{flex:1; height:3px; border-radius:2px; background:var(--rule); transition:background .22s}
.tk.on{background:var(--flag-line)}
.tk.done{background:var(--flag)}
.hint{
  font-family:var(--mono); font-size:clamp(.62rem,.8vw,.76rem);
  letter-spacing:.1em; color:var(--faint); white-space:nowrap; flex:none;
}
kbd{
  font:inherit; border:1px solid var(--rule); border-radius:3px;
  padding:.1em .45em; color:var(--dim);
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- full pages ---------- */
.page{display:none; text-align:center; max-width:min(78rem,94vw)}
body.is-page .form{display:none}
body.is-page .page{display:block}
body.is-cover .top{visibility:hidden}
body.is-cover .ticks,body.is-cover .hint{visibility:hidden}
.page>*{animation:rise var(--dur) cubic-bezier(.2,.7,.3,1) both}

/* cover */
.mini{width:clamp(14rem,26vw,22rem); height:auto; display:block; margin:0 auto clamp(1.4rem,3vh,2.6rem)}
.mini .box{fill:var(--surface); stroke:var(--rule); stroke-width:2}
.mini .bad{fill:var(--flag-soft); stroke:var(--flag); stroke-width:2; stroke-dasharray:6 5}
.mini text{font-family:var(--sans); font-weight:700; fill:var(--ink)}
.mini .lb{font-size:15px; fill:var(--dim)}
.mini .v{font-size:19px}
.mini .q{font-size:22px; fill:var(--flag); font-weight:900}
.mini .caret{fill:var(--ink); animation:blink 1.1s steps(1) infinite}
.tt{
  font-size:clamp(1.9rem,5.2vw,4.4rem); font-weight:900; line-height:1.28;
  letter-spacing:.01em; text-wrap:balance;
}
.tt em{font-style:normal; color:var(--flag)}
.sub{
  margin-top:clamp(.8rem,1.6vh,1.3rem); font-family:var(--mono);
  font-size:clamp(.78rem,1.3vw,1.1rem); letter-spacing:.26em;
  text-transform:uppercase; color:var(--dim);
}
.by{
  margin-top:clamp(1.6rem,4vh,3rem); font-family:var(--mono);
  font-size:clamp(.68rem,.95vw,.86rem); letter-spacing:.16em; color:var(--faint);
}

/* shared page type */
.kick{
  font-family:var(--mono); font-size:clamp(.7rem,1vw,.9rem); letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); margin-bottom:clamp(1rem,2.4vh,1.8rem);
}
.big{font-size:clamp(1.4rem,3.1vw,2.6rem); font-weight:900; line-height:1.34; text-wrap:balance}
.big em{font-style:normal; color:var(--flag)}
.lead{margin-top:.8rem; font-size:clamp(.95rem,1.5vw,1.35rem); color:var(--dim); text-wrap:balance}
.lead b{color:var(--ink)}

/* intro: the falsehoods */
.falses{
  list-style:none; display:inline-flex; flex-direction:column; gap:.35em; text-align:left;
  font-size:clamp(1rem,1.9vw,1.7rem); font-weight:500;
}
.falses li{display:grid; grid-template-columns:3.2em 1fr; align-items:baseline; color:var(--dim)}
.falses i{font-style:normal; font-family:var(--mono); font-size:.62em; color:var(--faint); letter-spacing:.06em}
.falses li.me{color:var(--ink); font-weight:900}
.falses li.me i{color:var(--flag)}
.falses li.me span{background:var(--flag-soft); box-shadow:inset 0 -.12em 0 var(--flag); padding:0 .15em}
.today{margin-top:clamp(1.4rem,3.4vh,2.6rem)}

/* fermi */
.bar{
  margin:clamp(1.6rem,4vh,2.8rem) auto 0; width:min(58rem,88vw);
  display:flex; height:clamp(2.6rem,6vh,4rem); border-radius:8px; overflow:hidden;
  font-size:clamp(.72rem,1.1vw,1rem); font-weight:700;
}
.bar>div{display:flex; align-items:center; justify-content:center; padding:0 .6em; white-space:nowrap}
.bar .s1{flex:45; background:var(--ink); color:var(--ground)}
.bar .s2{flex:35; background:var(--rule); color:var(--ink)}
.bar .s3{flex:20; background:var(--flag); color:#FBF8F4}
.legend{
  width:min(58rem,88vw); margin:.7rem auto 0; display:flex; text-align:left;
  font-size:clamp(.66rem,.95vw,.86rem); color:var(--dim); line-height:1.6;
}
.legend>div{padding-right:1em}
.legend .l1{flex:45} .legend .l2{flex:35} .legend .l3{flex:20; color:var(--flag)}
.fine{margin-top:clamp(1.2rem,3vh,2rem); font-size:clamp(.66rem,.9vw,.82rem); color:var(--faint)}

/* icao */
.pp{
  margin:clamp(1.2rem,3vh,2rem) auto 0; width:min(54rem,88vw); text-align:left;
  background:var(--surface); border:1px solid var(--rule); border-radius:14px; overflow:hidden;
}
.viz{padding:clamp(1rem,2.4vh,1.6rem) clamp(1.2rem,2.4vw,2rem)}
.tag{
  font-family:var(--mono); font-size:clamp(.6rem,.85vw,.78rem); letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);
}
.tag b{color:var(--fix); font-weight:600}
.mrz .tag b{color:var(--flag)}
.vizrow{margin-top:.5rem; display:grid; grid-template-columns:auto 1fr; gap:.15rem 1.4rem; align-items:baseline}
.vizrow span{font-size:clamp(.66rem,.9vw,.82rem); color:var(--dim)}
.vizrow strong{font-size:clamp(1.15rem,2.3vw,2rem); font-weight:900}
.mrz{
  padding:clamp(.9rem,2vh,1.3rem) clamp(1.2rem,2.4vw,2rem);
  background:var(--ground); border-top:1px dashed var(--rule);
}
.mrz code{
  display:block; margin-top:.45rem; font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:clamp(.72rem,1.42vw,1.32rem); letter-spacing:.06em; white-space:nowrap; overflow:hidden;
}
.mrz code u{text-decoration:none; color:var(--flag); background:var(--flag-soft); border-radius:2px}
.pts{
  margin:clamp(1.1rem,2.6vh,1.8rem) auto 0; width:min(54rem,88vw); text-align:left;
  list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:.6rem 2rem;
  font-size:clamp(.82rem,1.15vw,1.05rem); color:var(--dim); line-height:1.7;
}
.pts b{color:var(--ink)}
.pts li{border-left:2px solid var(--rule); padding-left:.8em}

/* data structure */
.tree{
  display:inline-block; text-align:left; margin-top:clamp(1rem,2.4vh,1.6rem);
  font-family:var(--mono); font-size:clamp(.6rem,1.08vw,1.02rem); line-height:1.78; white-space:pre;
  background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  padding:1.1em 1.6em;
}
.tree i{font-style:normal; color:var(--faint)}
.tree .ty{color:var(--amber)}
.tree .k{color:var(--flag); font-weight:600}
.tree .o{color:var(--fix); font-weight:600}

/* slogan */
.four{
  list-style:none; display:grid; grid-template-columns:repeat(2,auto); justify-content:center;
  gap:clamp(.6rem,1.6vh,1.2rem) clamp(1.6rem,4vw,3.6rem); margin-top:clamp(1.2rem,3vh,2.2rem);
  font-size:clamp(1.6rem,4vw,3.6rem); font-weight:900; line-height:1.3; text-align:left;
}
.four{counter-reset:four}
.four li{counter-increment:four}
.four li::before{content:counter(four,decimal-leading-zero); color:var(--flag); font-family:var(--mono); font-weight:600; margin-right:.5em; font-size:.5em; vertical-align:.35em}

/* outro */
.qrow{
  margin-top:clamp(1.1rem,2.6vh,2rem);
  display:flex; flex-direction:column; align-items:center;
  gap:clamp(.9rem,2.2vh,1.5rem); text-align:center;
  color:inherit; text-decoration:none; cursor:pointer;
  border-radius:14px; padding:.7rem 1.1rem;
  transition:transform .22s cubic-bezier(.2,.8,.3,1), background .22s;
}
.qrow:hover,.qrow:focus-visible{background:color-mix(in srgb, var(--ink) 6%, transparent)}
.qrow:hover{transform:translateY(-3px)}
.qrow:hover .repo{color:var(--flag)}
.qrow:focus-visible{outline:2px solid var(--flag); outline-offset:3px}
.qrow::after{
  content:'↗'; font-family:var(--mono); font-size:clamp(.7rem,.95vw,.9rem);
  color:var(--faint); letter-spacing:.1em; transition:color .22s,transform .22s;
}
.qrow:hover::after{color:var(--flag); transform:translate(2px,-2px)}
.qrow>div{min-width:0; display:flex; flex-direction:column; align-items:center; gap:.45rem}
.qr{height:auto; flex:none; border-radius:5px; background:#FBF8F4; box-shadow:0 1px 0 rgba(0,0,0,.18)}
.qr path{fill:#17120F}
/* モジュール境界のアンチエイリアスを切る。小さい方（.qr-s）には掛けない。 */
.qr-l{width:clamp(13rem,23vw,21rem); border-radius:12px; shape-rendering:crispEdges}
.repo{font-family:var(--mono); font-size:clamp(.8rem,1.24vw,1.18rem); font-weight:600; white-space:nowrap; transition:color .22s}
.badges{margin-top:.35rem; display:flex; gap:.45rem; flex-wrap:wrap; justify-content:center}
.badge{
  font-family:var(--mono); font-size:clamp(.6rem,.82vw,.75rem); letter-spacing:.1em;
  border:1px solid var(--rule); border-radius:999px; padding:.3em .85em; color:var(--dim);
}

/* ---------- 常時表示のスタンプ（フッター右） ---------- */
.stamp{
  display:flex; align-items:center; gap:.6rem;
  opacity:.72; pointer-events:none; user-select:none; flex:none;
}
body.is-outro .stamp{visibility:hidden}
.qr-s{width:clamp(2.4rem,3.2vw,3.2rem)}
.stamp-t{
  font-family:var(--mono); font-size:clamp(.54rem,.7vw,.7rem);
  line-height:1.55; letter-spacing:.03em; color:var(--dim); text-align:left;
}
.stamp-t i{display:block; font-style:normal; color:var(--faint)}
</style>
</head>
<body>

<header class="top">
  <div class="act" id="act">Personal names &nbsp;/&nbsp; <b>姓＋名</b></div>
  <div class="count" id="count">事例 <b>00</b> / 12</div>
</header>

<main class="stage"><div class="form" id="form"></div><section class="page" id="page"></section></main>

<aside class="rail" id="rail"></aside>

<footer class="bottom">
  <div class="ticks" id="ticks"></div>

const F = [
 {act:A1, svc:'よくあるフォーム', who:'インドネシア',

  verdict:['err','登録できません'],
  label:'姓が無い',
  punch:'「スカルノ大統領は、姓の欄に何を書けばいいですか。」',

  src:'W3C「Personal names around the world」、英国政府の命名慣習ガイド（2006）'},

 {act:A1, svc:'よくあるフォーム', who:'ミャンマー',

  src:'W3C「Personal names around the world」'},

 {act:A1, svc:'よくあるフォーム', who:'タミル系',

  verdict:['ok','登録できました'],

  note:'スリランカや南インドのタミル系は「<b>父の名＋本人の名</b>」で、父の名は頭文字にされることが多い。ソマリアは「本人＋父＋祖父」の3つで、3つ揃って初めて本人を特定できる。',

  verdict:['ok','登録できました'],

 {act:A2, svc:'Facebook', who:'ドイツ・英国',

 {act:A2, svc:'三重県 電子申請', who:'米国',

   '<div class="mrz"><p class="tag"><b>MRZ</b> &nbsp;機械読取欄 = 派生表現（A–Z と &lt; のみ、名前は39文字）</p>'+
     '<code>P&lt;UTO<u>OBRIEN&lt;SMITH</u>&lt;&lt;<u>ZOE</u>&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code></div>'+
 '</div>'+
 '<ul class="pts">'+

   '<li><b>MRZ は意図的に情報を落とした派生表現。</b>アポストロフィは削除、ハイフンは区切り文字に。規定の手順以外で切り詰めない。</li>'+

const OUTRO =
 '<p class="big">2欄に収まらない人は、<em>15〜17億人</em>。</p>'+
 '<p class="lead">規則15個と、実サービスの調査結果の全文はこちら</p>'+
 '<a class="qrow" href="./static.html" target="_blank" rel="noopener">'+
   '<svg class="qr qr-l" viewBox="-4 -4 41 41"><path d="'+QR_D+'"/></svg>'+
   '<div>'+
     '<div class="repo">kota1021.github.io/talks/person-names/static.html</div>'+
     '<div class="badges">'+
       '<span class="badge">データ構造</span>'+
       '<span class="badge">規則 15</span>'+
       '<span class="badge">アンチパターン 6</span>'+
       '<span class="badge">参考資料</span>'+
     '</div>'+
   '</div>'+
 '</a>';

/* ============ render ============ */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const N = F.length;
const pad = n => String(n).padStart(2,'0');

function formHTML(f){
  let h = '<div class="fhead"><div><div class="svc">'+esc(f.svc)+'</div><div class="ftitle">'+GENERIC+'</div></div>'+
          '<div class="who">'+esc(f.who)+'</div></div>';
  f.fields.forEach(x=>{
    const v = x.was ? '<span class="rw-was">'+esc(x.was)+'</span><span class="rw-arr">→</span>'+esc(x.v) : esc(x.v);
    h += '<div class="row '+(x.st||'')+'"><label>'+esc(x.l)+(x.req?'<span class="req">必須</span>':'')+'</label>'+
         '<div class="inp'+(v?'':' empty')+'">'+v+'</div>'+
         (x.m ? '<div class="fmsg">'+esc(x.m)+'</div>' : '')+'</div>';
  });
  h += '<div class="submit"><span class="verdict '+f.verdict[0]+'">'+(f.verdict[0]==='ok'?'✓ ':'✕ ')+esc(f.verdict[1])+'</span>'+
       '<span class="btn">登録する</span></div>';
  return h;
}

const ticks = document.getElementById('ticks');
ticks.innerHTML = F.map(()=>'<div class="tk"></div>').join('');
const TK = [...ticks.children];

/* ============ steps ============ */
const STEPS = [{t:'page',h:COVER,cover:1},{t:'page',h:INTRO,act:'<b>はじめに</b>'}];
F.forEach((f,i)=>{
  if(i===5){
    STEPS.push({t:'page',h:FERMI,act:'間奏 &nbsp;/&nbsp; <b>規模</b>',done:5});
    STEPS.push({t:'page',h:ICAO,act:'第2幕 &nbsp;/&nbsp; <b>国際規格</b>',done:5});
  }
  STEPS.push({t:'ask',f,i}); STEPS.push({t:'tell',f,i});
});
STEPS.push({t:'page',h:STRUCT,act:'第4幕 &nbsp;/&nbsp; <b>結論</b>',done:N});
STEPS.push({t:'page',h:SLOGAN,act:'第4幕 &nbsp;/&nbsp; <b>結論</b>',done:N});
STEPS.push({t:'page',h:OUTRO,act:'<b>持ち帰り</b>',done:N,outro:1});

const rail = document.getElementById('rail');
const page = document.getElementById('page');
const form = document.getElementById('form');
const actEl = document.getElementById('act');
const countEl = document.getElementById('count');
let step = 0;

function paint(){
  const s = STEPS[step];
  document.body.classList.remove('open','is-page','is-cover','is-outro');
  form.classList.remove('hit');

  if(s.t==='page'){
    document.body.classList.add('is-page');
    if(s.cover) document.body.classList.add('is-cover');
    if(s.outro) document.body.classList.add('is-outro');
    page.innerHTML = s.h;
    rail.innerHTML = '';
    if(s.act) actEl.innerHTML = s.act;
    const d = s.done||0;
    countEl.innerHTML = '事例 <b>'+pad(d)+'</b> / '+N;
    TK.forEach((t,n)=>t.className='tk'+(n<d?' done':''));
    return;
  }

  const {f,i} = s;
  actEl.innerHTML = f.act[0]+' &nbsp;/&nbsp; <b>'+f.act[1]+'</b>';
  countEl.innerHTML = '事例 <b>'+pad(i+1)+'</b> / '+N;
  TK.forEach((t,n)=>{ t.className = 'tk' + (n<i ? ' done' : n===i ? (s.t==='tell'?' done':' on') : ''); });

  form.innerHTML = formHTML(f);
  form.classList.add('hit');
  document.body.classList.add('open');
  if(s.t==='ask'){
    rail.innerHTML = '<div class="no">'+pad(i+1)+'</div><div class="wait">？</div>';
  }else{
    let h = '<div class="reveal" style="display:flex;flex-direction:column;gap:1.1rem;flex:1">';
    h += '<div class="no">'+pad(i+1)+'</div>';
    h += '<h2 class="label">'+f.label+'</h2>';
    if(f.punch) h += '<p class="punch">'+f.punch+'</p>';
    h += '<p class="note">'+f.note+'</p>';
    h += '<div class="src">'+f.src+'</div></div>';
    rail.innerHTML = h;
  }
}
const go = d => { step = Math.max(0, Math.min(STEPS.length-1, step+d)); paint(); };

addEventListener('keydown', e=>{
  const k = e.key;
  if(document.activeElement && document.activeElement.tagName==='A' && (k===' '||k==='Enter')) return;
  if([' ','ArrowRight','ArrowDown','PageDown','Enter'].includes(k)){ e.preventDefault(); go(1); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); go(-1); }
  else if(k==='Home'){ e.preventDefault(); step=0; paint(); }
  else if(k==='End'){ e.preventDefault(); step=STEPS.length-1; paint(); }
  else if(k==='t'||k==='T'){
    const cur = document.documentElement.getAttribute('data-theme');
    const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    document.documentElement.setAttribute('data-theme', isDark?'light':'dark');
  }
});
addEventListener('click', e=>{
  if(e.target.closest('a') || e.target.closest('.rail')) return;
  go(1);
});
let lock = 0;
addEventListener('wheel', e=>{
  const now = Date.now(); if(now-lock < 380) return;
  if(Math.abs(e.deltaY) < 8) return;
  lock = now; go(e.deltaY > 0 ? 1 : -1);
}, {passive:true});

paint();
</script>
