<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人名は「姓＋名」ではない</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">

<style>
:root{
  --ground:#F1EDE8; --surface:#FBF8F4; --rule:#DED4C8;
  --ink:#241C16; --dim:#6E6055; --faint:#9C8C7E;
  --flag:#C0361D; --flag-soft:rgba(192,54,29,.10); --flag-line:rgba(192,54,29,.38);
  --fix:#2C7355; --fix-soft:rgba(44,115,85,.10); --amber:#9A6B12;
  --mono:'IBM Plex Mono','Zen Kaku Gothic New',ui-monospace,monospace;
  --sans:'Zen Kaku Gothic New',system-ui,sans-serif;
  --dur:.34s;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#17120F; --surface:#1E1814; --rule:#372C25;
    --ink:#EFE6DC; --dim:#A29386; --faint:#6B5D52;
    --flag:#F2603F; --flag-soft:rgba(242,96,63,.13); --flag-line:rgba(242,96,63,.45);
    --fix:#5FBE93; --fix-soft:rgba(95,190,147,.12); --amber:#D9A441;
  }
}
:root[data-theme="dark"]{
  --ground:#17120F; --surface:#1E1814; --rule:#372C25;
  --ink:#EFE6DC; --dim:#A29386; --faint:#6B5D52;
  --flag:#F2603F; --flag-soft:rgba(242,96,63,.13); --flag-line:rgba(242,96,63,.45);
  --fix:#5FBE93; --fix-soft:rgba(95,190,147,.12); --amber:#D9A441;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  display:grid; grid-template-rows:auto 1fr auto; cursor:default;
}

/* ---------- top bar ---------- */
.top{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:1.1rem clamp(1rem,3vw,2.6rem) .9rem;
  border-bottom:1px solid var(--rule);
  font-family:var(--mono); font-size:clamp(.72rem,1vw,.9rem);
  letter-spacing:.14em; text-transform:uppercase;
}
.act{color:var(--dim); transition:color var(--dur)}
.act b{color:var(--ink); font-weight:600; letter-spacing:.1em}
.count{color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap}
.count b{color:var(--flag); font-weight:600; font-size:1.35em}

/* ---------- stage ---------- */
.stage{
  display:grid; place-items:center; overflow:hidden;
  padding:clamp(1rem,3vh,2.4rem) clamp(1rem,3vw,3rem);
}

@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- progress ---------- */
.bottom{
  display:flex; align-items:center; gap:clamp(1rem,2.4vw,2rem);
  padding:.45rem clamp(1rem,3vw,2.6rem) .5rem; border-top:1px solid var(--rule);
}
.ticks{display:flex; gap:4px; flex:1 1 auto; min-width:2rem}
.tk{flex:1; height:3px; border-radius:2px; background:var(--rule); transition:background .22s}
.tk.done{background:var(--flag)}
.hint{
  font-family:var(--mono); font-size:clamp(.62rem,.8vw,.76rem);
  letter-spacing:.1em; color:var(--faint); white-space:nowrap; flex:none;
}
kbd{
  font:inherit; border:1px solid var(--rule); border-radius:3px;
  padding:.1em .45em; color:var(--dim);
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- full pages ---------- */
.page{text-align:center; max-width:min(78rem,94vw)}
body.is-cover .top{visibility:hidden}
body.is-cover .ticks,body.is-cover .hint{visibility:hidden}
.page>*{animation:rise var(--dur) cubic-bezier(.2,.7,.3,1) both}

/* cover */
.mini{width:clamp(14rem,26vw,22rem); height:auto; display:block; margin:0 auto clamp(1.4rem,3vh,2.6rem)}
.mini .box{fill:var(--surface); stroke:var(--rule); stroke-width:2}
.mini .bad{fill:var(--flag-soft); stroke:var(--flag); stroke-width:2; stroke-dasharray:6 5}
.mini text{font-family:var(--sans); font-weight:700; fill:var(--ink)}
.mini .lb{font-size:15px; fill:var(--dim)}
.mini .v{font-size:19px}
.mini .q{font-size:22px; fill:var(--flag); font-weight:900}
.mini .caret{fill:var(--ink); animation:blink 1.1s steps(1) infinite}
.tt{
  font-size:clamp(1.9rem,5.2vw,4.4rem); font-weight:900; line-height:1.28;
  letter-spacing:.01em; text-wrap:balance;
}
.tt em{font-style:normal; color:var(--flag)}
.sub{
  margin-top:clamp(.8rem,1.6vh,1.3rem); font-family:var(--mono);
  font-size:clamp(.78rem,1.3vw,1.1rem); letter-spacing:.26em;
  text-transform:uppercase; color:var(--dim);
}
.by{
  margin-top:clamp(1.6rem,4vh,3rem); font-family:var(--mono);
  font-size:clamp(.68rem,.95vw,.86rem); letter-spacing:.16em; color:var(--faint);
}

/* shared page type */
.kick{
  font-family:var(--mono); font-size:clamp(.7rem,1vw,.9rem); letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); margin-bottom:clamp(1rem,2.4vh,1.8rem);
}
.big{font-size:clamp(1.4rem,3.1vw,2.6rem); font-weight:900; line-height:1.34; text-wrap:balance}
.big em{font-style:normal; color:var(--flag)}
.lead{margin-top:.8rem; font-size:clamp(.95rem,1.5vw,1.35rem); color:var(--dim); text-wrap:balance}
.lead b{color:var(--ink)}
.lead.rule-lead{margin-bottom:clamp(1rem,2.6vh,2rem)}

/* intro: the falsehoods */
.falses{
  list-style:none; display:inline-flex; flex-direction:column; gap:.35em; text-align:left;
  font-size:clamp(1rem,1.9vw,1.7rem); font-weight:500;
}
.falses li{display:grid; grid-template-columns:3.2em 1fr; align-items:baseline; color:var(--dim)}
.falses i{font-style:normal; font-family:var(--mono); font-size:.62em; color:var(--faint); letter-spacing:.06em}
.falses li.me{color:var(--ink); font-weight:900}
.falses li.me i{color:var(--flag)}
.falses li.me span{background:var(--flag-soft); box-shadow:inset 0 -.12em 0 var(--flag); padding:0 .15em}
.today{margin-top:clamp(1.4rem,3.4vh,2.6rem)}

/* fermi */
.bar{
  margin:clamp(1.6rem,4vh,2.8rem) auto 0; width:min(58rem,88vw);
  display:flex; height:clamp(2.6rem,6vh,4rem); border-radius:8px; overflow:hidden;
  font-size:clamp(.72rem,1.1vw,1rem); font-weight:700;
}
.bar>div{display:flex; align-items:center; justify-content:center; padding:0 .6em; white-space:nowrap}
.bar .s1{flex:45; background:var(--ink); color:var(--ground)}
.bar .s2{flex:35; background:var(--rule); color:var(--ink)}
.bar .s3{flex:20; background:var(--flag); color:#FBF8F4}
.legend{
  width:min(58rem,88vw); margin:.7rem auto 0; display:flex; text-align:left;
  font-size:clamp(.66rem,.95vw,.86rem); color:var(--dim); line-height:1.6;
}
.legend>div{padding-right:1em}
.legend .l1{flex:45} .legend .l2{flex:35} .legend .l3{flex:20; color:var(--flag)}
.fine{margin-top:clamp(1.2rem,3vh,2rem); font-size:clamp(.66rem,.9vw,.82rem); color:var(--faint)}

/* icao */
.pp{
  margin:clamp(1.2rem,3vh,2rem) auto 0; width:min(54rem,88vw); text-align:left;
  background:var(--surface); border:1px solid var(--rule); border-radius:14px; overflow:hidden;
}
.viz{padding:clamp(1rem,2.4vh,1.6rem) clamp(1.2rem,2.4vw,2rem)}
.tag{
  font-family:var(--mono); font-size:clamp(.6rem,.85vw,.78rem); letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);
}
.tag b{color:var(--fix); font-weight:600}
.mrz .tag b{color:var(--flag)}
.vizrow{margin-top:.5rem; display:grid; grid-template-columns:auto 1fr; gap:.15rem 1.4rem; align-items:baseline}
.vizrow span{font-size:clamp(.66rem,.9vw,.82rem); color:var(--dim)}
.vizrow strong{font-size:clamp(1.15rem,2.3vw,2rem); font-weight:900}
.mrz{
  padding:clamp(.9rem,2vh,1.3rem) clamp(1.2rem,2.4vw,2rem);
  background:var(--ground); border-top:1px dashed var(--rule);
}
.mrz code{
  display:block; margin-top:.45rem; font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:clamp(.72rem,1.42vw,1.32rem); letter-spacing:.06em; white-space:nowrap; overflow:hidden;
}
.mrz code u{text-decoration:none; color:var(--flag); background:var(--flag-soft); border-radius:2px}
.pts{
  margin:clamp(1.1rem,2.6vh,1.8rem) auto 0; width:min(54rem,88vw); text-align:left;
  list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:.6rem 2rem;
  font-size:clamp(.82rem,1.15vw,1.05rem); color:var(--dim); line-height:1.7;
}
.pts b{color:var(--ink)}
.pts li{border-left:2px solid var(--rule); padding-left:.8em}

/* data structure */
.tree{
  display:inline-block; text-align:left; margin-top:clamp(1rem,2.4vh,1.6rem);
  font-family:var(--mono); font-size:clamp(.6rem,1.08vw,1.02rem); line-height:1.78; white-space:pre;
  background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  padding:1.1em 1.6em;
}
.tree i{font-style:normal; color:var(--faint)}
.tree .ty{color:var(--amber)}
.tree .k{color:var(--flag); font-weight:600}
.tree .o{color:var(--fix); font-weight:600}

/* slogan */
.four{
  list-style:none; display:grid; grid-template-columns:auto; justify-content:center;
  gap:clamp(.6rem,1.6vh,1.2rem) clamp(1.6rem,4vw,3.6rem); margin-top:clamp(1.2rem,3vh,2.2rem);
  font-size:clamp(1.05rem,2.2vw,1.9rem); font-weight:900; line-height:1.35; text-align:left;
}
.four{counter-reset:four}
.four li{counter-increment:four}
.four li::before{content:counter(four,decimal-leading-zero); color:var(--flag); font-family:var(--mono); font-weight:600; margin-right:.5em; font-size:.5em; vertical-align:.35em}

.layers{display:flex; justify-content:center; gap:clamp(1.6rem,4vw,4rem); margin-top:clamp(1.2rem,3vh,2.2rem); text-align:left; flex-wrap:wrap}
.layers .four{margin-top:.5em}
.lname{font-weight:900; font-size:clamp(.9rem,1.4vw,1.25rem); color:var(--dim); border-bottom:2px solid var(--rule); padding-bottom:.3em}
.lname i{font-style:normal; font-weight:500; margin-left:.8em; font-size:.8em; color:var(--faint)}

/* counterexamples */
.names{
  list-style:none; margin:clamp(1.2rem,3vh,2rem) auto 0; width:min(66rem,92vw);
  display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(.5rem,1.2vw,.9rem); text-align:left;
}
.names li{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:.8em 1em; display:flex; flex-direction:column; gap:.25em}
.names b{font-size:clamp(.9rem,1.5vw,1.35rem); font-weight:900; overflow-wrap:anywhere}
.names span{font-family:var(--mono); font-size:clamp(.6rem,.82vw,.76rem); letter-spacing:.1em; color:var(--faint)}
.names i{font-style:normal; font-size:clamp(.7rem,.95vw,.9rem); color:var(--flag)}
.names.addr i{color:var(--ink); font-size:clamp(.8rem,1.1vw,1.05rem); line-height:1.6}
.names.addr span{color:var(--flag); font-weight:600}
@media (max-width:700px){.names{grid-template-columns:1fr 1fr}}

/* real services */
.svcs{
  list-style:none; margin:clamp(1.2rem,3vh,2rem) auto 0; width:min(66rem,92vw);
  display:grid; grid-template-columns:1fr 1fr; gap:clamp(.6rem,1.4vw,1rem); text-align:left;
}
.svcs li{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:.85em 1.1em; display:flex; flex-direction:column; gap:.35em}
.svcs .sv{display:flex; justify-content:space-between; font-family:var(--mono); font-size:clamp(.62rem,.85vw,.8rem); letter-spacing:.1em; color:var(--faint)}
.svcs .in{font-size:clamp(1rem,1.7vw,1.5rem); font-weight:900; overflow-wrap:anywhere; padding:.2em .5em; border-radius:6px; border:1.5px solid var(--flag); background:var(--flag-soft)}
.svcs li.rw .in{border-color:var(--amber); background:transparent}
.svcs s{color:var(--flag); opacity:.7}
.svcs .in i{font-style:normal; color:var(--faint); padding:0 .4em; font-family:var(--mono)}
.svcs .ms{font-size:clamp(.72rem,1vw,.95rem); font-weight:700; color:var(--flag)}
.svcs li.rw .ms{color:var(--amber)}
.svcs .ex{font-size:clamp(.68rem,.9vw,.86rem); color:var(--dim); line-height:1.6}
@media (max-width:700px){.svcs{grid-template-columns:1fr}}

/* outro */
.qrow{
  margin-top:clamp(1.1rem,2.6vh,2rem);
  display:flex; flex-direction:column; align-items:center;
  gap:clamp(.9rem,2.2vh,1.5rem); text-align:center;
  color:inherit; text-decoration:none; cursor:pointer;
  border-radius:14px; padding:.7rem 1.1rem;
  transition:transform .22s cubic-bezier(.2,.8,.3,1), background .22s;
}
.qrow:hover,.qrow:focus-visible{background:color-mix(in srgb, var(--ink) 6%, transparent)}
.qrow:hover{transform:translateY(-3px)}
.qrow:hover .repo{color:var(--flag)}
.qrow:focus-visible{outline:2px solid var(--flag); outline-offset:3px}
.qrow::after{
  content:'↗'; font-family:var(--mono); font-size:clamp(.7rem,.95vw,.9rem);
  color:var(--faint); letter-spacing:.1em; transition:color .22s,transform .22s;
}
.qrow:hover::after{color:var(--flag); transform:translate(2px,-2px)}
.qrow>div{min-width:0; display:flex; flex-direction:column; align-items:center; gap:.45rem}
.qr{height:auto; flex:none; border-radius:5px; background:#FBF8F4; box-shadow:0 1px 0 rgba(0,0,0,.18)}
.qr path{fill:#17120F}
/* モジュール境界のアンチエイリアスを切る。小さい方（.qr-s）には掛けない。 */
.qr-l{width:clamp(13rem,23vw,21rem); border-radius:12px; shape-rendering:crispEdges}
.repo{font-family:var(--mono); font-size:clamp(.8rem,1.24vw,1.18rem); font-weight:600; white-space:nowrap; transition:color .22s}
.badges{margin-top:.35rem; display:flex; gap:.45rem; flex-wrap:wrap; justify-content:center}
.badge{
  font-family:var(--mono); font-size:clamp(.6rem,.82vw,.75rem); letter-spacing:.1em;
  border:1px solid var(--rule); border-radius:999px; padding:.3em .85em; color:var(--dim);
}

/* ---------- 常時表示のスタンプ（フッター右） ---------- */
.stamp{
  display:flex; align-items:center; gap:.6rem;
  opacity:.72; pointer-events:none; user-select:none; flex:none;
}
body.is-outro .stamp{visibility:hidden}
.qr-s{width:clamp(2.4rem,3.2vw,3.2rem)}
.stamp-t{
  font-family:var(--mono); font-size:clamp(.54rem,.7vw,.7rem);
  line-height:1.55; letter-spacing:.03em; color:var(--dim); text-align:left;
}
.stamp-t i{display:block; font-style:normal; color:var(--faint)}
</style>
</head>

<header class="top">
  <div class="act" id="act">Personal names &nbsp;/&nbsp; <b>姓＋名</b></div>
  <div class="count" id="count"></div>
</header>

<main class="stage"><section class="page" id="page"></section></main>


<footer class="bottom">
  <div class="ticks" id="ticks"></div>
  <div class="hint"><kbd>Space</kbd> 進む &nbsp; <kbd>&larr;</kbd> 戻る &nbsp; <kbd>T</kbd> テーマ</div>

function paint(){

  const k = e.key;
  if(document.activeElement && document.activeElement.tagName==='A' && (k===' '||k==='Enter')) return;
  if([' ','ArrowRight','ArrowDown','PageDown','Enter'].includes(k)){ e.preventDefault(); go(1); }

});

}, {passive:true});
