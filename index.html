<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登壇資料 — Kotaro Matsumoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --ground:#F1EDE8; --surface:#FBF8F4; --rule:#DED4C8;
  --ink:#241C16; --dim:#6E6055; --faint:#9C8C7E; --flag:#C0361D;
  --mono:'IBM Plex Mono','Zen Kaku Gothic New',ui-monospace,monospace;
  --sans:'Zen Kaku Gothic New',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#17120F; --surface:#1E1814; --rule:#372C25;
  --ink:#EFE6DC; --dim:#A29386; --faint:#6B5D52; --flag:#F2603F;
}}
:root[data-theme="dark"]{
  --ground:#17120F; --surface:#1E1814; --rule:#372C25;
  --ink:#EFE6DC; --dim:#A29386; --faint:#6B5D52; --flag:#F2603F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground); color:var(--ink); font-family:var(--sans); line-height:1.85;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:44rem; margin-inline:auto; padding:clamp(3rem,10vh,6rem) clamp(1.2rem,5vw,2rem)}
.eyebrow{font-family:var(--mono); font-size:.76rem; letter-spacing:.26em; text-transform:uppercase;
         color:var(--dim); margin-bottom:.9rem}
h1{font-size:clamp(1.7rem,5vw,2.6rem); font-weight:900; line-height:1.3}
.sub{margin-top:.7rem; color:var(--dim); font-size:.98rem}
ul{list-style:none; margin-top:clamp(2.4rem,7vh,3.6rem); display:flex; flex-direction:column; gap:1rem}
a.card{display:block; color:inherit; text-decoration:none; background:var(--surface);
       border:1px solid var(--rule); border-radius:12px; padding:clamp(1.1rem,3vw,1.6rem);
       transition:transform .2s cubic-bezier(.2,.8,.3,1), border-color .2s}
a.card:hover{transform:translateY(-3px); border-color:var(--flag)}
a.card:focus-visible{outline:2px solid var(--flag); outline-offset:3px}
a.card:hover h2{color:var(--flag)}
h2{font-size:clamp(1.1rem,2.6vw,1.35rem); font-weight:700; line-height:1.5; transition:color .2s}
.desc{margin-top:.5rem; color:var(--dim); font-size:.9rem; line-height:1.8}
.meta{margin-top:.8rem; display:flex; gap:.4rem; flex-wrap:wrap}
.tag{font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; color:var(--faint);
     border:1px solid var(--rule); border-radius:999px; padding:.28em .8em}
.alt{margin-top:1.2rem; font-size:.88rem; color:var(--dim)}
.alt a{color:var(--flag)}
footer{margin-top:clamp(3rem,9vh,5rem); padding-top:1.4rem; border-top:1px solid var(--rule);
       color:var(--faint); font-size:.82rem}
footer a{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Talks</p>
  <h1>登壇資料</h1>
  <p class="sub">勉強会・カンファレンスで話した資料。</p>

  <ul>
    <li><a class="card" href="./cursed-cafe-api/">
      <h2>そのカフェ、注文が通りません</h2>
      <p class="desc">架空のカフェの、壊れた OpenAPI 定義をレビューする。</p>
      <p class="meta"><span class="tag">OpenAPI</span><span class="tag">API 設計</span><span class="tag">レビュー実況</span></p>
    </a></li>

  </ul>

  <p class="alt">全17指摘を一度に読むなら <a href="./cursed-cafe-api/static.html">静的版</a>。</p>


  <footer>
    松本幸太郎 · <a href="https://github.com/Kota1021">@Kota1021</a>
  </footer>
</div>
</body>
</html>
